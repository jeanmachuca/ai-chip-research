name: CI - Paper Generation Pipeline

on:
  push:
    branches: [ main, development ]
  pull_request:
    branches: [ development ]
  workflow_dispatch:
    inputs:
      model_name:
        description: "GGUF model name (e.g., llama-3.2-1b-q4_0)"
        required: false
        default: "llama-3.2-1b-q4_0"
      quant_format:
        description: "Quantization format (Q4_0, Q8_0, etc.)"
        required: false
        default: "Q4_0"
      arch_type:
        description: "Target architecture (FPGA/ASIC)"
        required: false
        default: "FPGA"

jobs:
  generate-paper:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --user pyyaml

      - name: Generate paper
        run: |
          python scripts/generate_paper.py \
            --model ${{ github.event.inputs.model_name || 'llama-3.2-1b-q4_0' }} \
            --quant ${{ github.event.inputs.quant_format || 'Q4_0' }} \
            --arch ${{ github.event.inputs.arch_type || 'FPGA' }} \
            --output papers

      - name: Install LaTeX toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            texlive-latex-base texlive-latex-recommended \
            texlive-fonts-recommended latexmk

      - name: Build PDF
        run: |
          cd papers
          TEXINPUTS=.:../tex: latexmk -pdf -interaction=nonstopmode -halt-on-error paper_*.tex

      - name: Clean auxiliary files
        run: |
          cd papers
          latexmk -c

      - name: Upload paper artifacts
        uses: actions/upload-artifact@v7
        with:
          name: paper-${{ github.event.inputs.model_name || 'llama-3.2-1b-q4_0' }}-${{ github.event.inputs.quant_format || 'Q4_0' }}
          path: |
            papers/*.tex
            papers/*.md
            papers/*.pdf
          retention-days: 30