name: CI - Paper Generation Pipeline

on:
  push:
    branches: [ main, development ]
  pull_request:
    branches: [ development ]
  workflow_dispatch:
    inputs:
      model_name:
        description: "GGUF model name (e.g., llama-3.2-1b-q4_0)"
        required: false
        default: "llama-3.2-1b-q4_0"
      quant_format:
        description: "Quantization format (Q4_0, Q8_0, etc.)"
        required: false
        default: "Q4_0"
      arch_type:
        description: "Target architecture (FPGA/ASIC)"
        required: false
        default: "FPGA"

jobs:
  generate-paper:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --user pyyaml

      - name: Generate paper
        run: |
          python scripts/generate_paper.py \
            --model ${{ github.event.inputs.model_name || 'llama-3.2-1b-q4_0' }} \
            --quant ${{ github.event.inputs.quant_format || 'Q4_0' }} \
            --arch ${{ github.event.inputs.arch_type || 'FPGA' }} \
            --output papers

      - name: Upload paper artifacts
        uses: actions/upload-artifact@v4
        with:
          name: paper-${{ github.event.inputs.model_name || 'llama-3.2-1b-q4_0' }}-${{ github.event.inputs.quant_format || 'Q4_0' }}
          path: papers/*
          retention-days: 30

  lint-verify:
    needs: generate-paper
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify LaTeX syntax
        run: |
          latexmk -pdf papers/*.tex 2>&1 || echo "LaTeX compilation note (images may be missing)"