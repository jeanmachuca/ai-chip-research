name: CI - Paper Generation Pipeline

on:
  push:
    branches: [ development ]
  pull_request:
    branches: [ development ]
  workflow_dispatch:

jobs:
  generate-paper:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --user pyyaml

      - name: Generate paper
        run: |
          python scripts/generate_paper.py \
            --model ${{ github.event.model_name || 'llama-3.2-1b-q4_0'}} \
            --quant ${{ github.event.quant_format || 'Q4_0'}} \
            --arch ${{ github.event.arch_type || 'FPGA'}} \
            --output papers

      - name: Upload paper artifacts
        uses: actions/upload-artifact@v4
        with:
          name: paper-${{ matrix.model }}-${{ matrix.quant }}
          path: papers/*
          retention-days: 30

  lint-verify:
    needs: generate-paper
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify LaTeX syntax
        run: |
          latexmk -pdf papers/*.tex 2>&1 || echo "LaTeX compilation note (images may be missing)"