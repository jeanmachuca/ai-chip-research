name: Zenodo Publication

on:
  workflow_dispatch:
    inputs:
      model_name:
        description: "GGUF model name (e.g., llama-3.2-1b-q4_0)"
        required: true
        default: "llama-3.2-1b-q4_0"
      quant_format:
        description: "Quantization format (Q4_0, Q8_0, etc.)"
        required: true
        default: "Q4_0"
      arch_type:
        description: "Target architecture (FPGA/ASIC)"
        required: true
        default: "FPGA"

permissions:
  contents: write

jobs:
  publish-zenodo:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --user pyyaml

      - name: Generate zenodo submission package
        run: |
          python scripts/generate_paper.py \
            --model ${{ github.event.inputs.model_name }} \
            --quant ${{ github.event.inputs.quant_format }} \
            --arch ${{ github.event.inputs.arch_type }} \
            --output submissions

      - name: Install LaTeX toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            texlive-latex-base texlive-latex-recommended \
            texlive-fonts-recommended latexmk

      - name: Build PDF
        run: |
          cd submissions
          TEXINPUTS=.:../tex: latexmk -pdf -interaction=nonstopmode -halt-on-error paper_*.tex
          latexmk -c

      - name: Upload submission package artifact
        uses: actions/upload-artifact@v7
        with:
          name: zenodo-submission-${{ github.event.inputs.model_name }}-${{ github.run_number }}
          path: |
            submissions/*.tex
            submissions/*.md
            submissions/*.pdf
            submissions/*.json
          retention-days: 90

      - name: Create release with submission package
        uses: softprops/action-gh-release@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag_name: research-${{ github.event.inputs.model_name }}-v${{ github.run_number }}
          name: "Research Release: ${{ github.event.inputs.model_name }} (${{ github.event.inputs.quant_format }} on ${{ github.event.inputs.arch_type }})"
          draft: true
          body: |
            Hardware accelerator research package for `${{ github.event.inputs.model_name }}` using **${{ github.event.inputs.quant_format }}** quantization on **${{ github.event.inputs.arch_type }}** architecture.

            ## Attachments
            - `paper_${{ github.event.inputs.model_name }}.pdf` — compiled IEEE conference paper
            - `paper_${{ github.event.inputs.model_name }}.tex` — LaTeX source
            - `report_${{ github.event.inputs.model_name }}.md` — research summary report
            - `zenodo_${{ github.event.inputs.model_name }}.json` — Zenodo deposition metadata

            ## Contents
            - SystemVerilog module implementations (`src/verilog/`)
            - Q4_0 dequantization datapath and systolic PE array design
            - Pipeline scripts for automated paper generation

            See `docs/` for full architecture details. Release created as draft; review and publish to finalize.
          files: |
            submissions/paper_*.pdf
            submissions/paper_*.tex
            submissions/report_*.md
            submissions/zenodo_*.json
